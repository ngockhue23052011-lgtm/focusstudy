<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FocusStudy — Học tập không sao nhãng</title>
<style>
*{box-sizing:border-box}:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10243b;--line:#1e3550;--text:#edf6ff;--muted:#8ea5bd;--accent:#63e6be;--accent2:#62a8ff;--danger:#ff6b7a;--warn:#ffd166;--orange:#ff9f43;--shadow:0 24px 70px #0008}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 10%,#14365b 0,#07111f 35%),var(--bg);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh}.topbar{min-height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;background:#07111fcc;backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.brand{font-weight:800;letter-spacing:.3px;font-size:19px}.brand span{color:var(--accent)}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff10;color:var(--text)}main{max-width:1180px;margin:auto;padding:42px 22px 70px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.panel{background:linear-gradient(145deg,#10233aee,#0b1729ee);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.heroText{padding:42px}.eyebrow{color:var(--accent);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1.5px}h1{font-size:clamp(38px,6vw,70px);line-height:.98;margin:13px 0 18px;letter-spacing:-2px}.heroText p{font-size:17px;line-height:1.65;color:var(--muted);max-width:680px}.primary{background:linear-gradient(135deg,#63e6be,#62a8ff);color:#06111e;font-weight:800;padding:14px 21px;border-radius:13px;box-shadow:0 10px 35px #63e6be25}.ghost{background:#ffffff08;color:var(--text);padding:12px 17px;border-radius:12px;border:1px solid var(--line)}.danger{background:#ff6b7a16;color:#ffb0b8;border:1px solid #ff6b7a55;padding:12px 17px;border-radius:12px}.actions{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap}.scorePanel{padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:13px;border-radius:50%;background:#0b192b}.ringInner{position:relative;z-index:1}.score{font-size:56px;font-weight:900}.scoreLabel{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.stat{padding:20px;border-radius:18px;background:#ffffff07;border:1px solid var(--line)}.stat .num{font-size:27px;font-weight:850;margin-top:7px}.stat small{color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:42px 0 15px}.sectionTitle h2{margin:0;font-size:24px}.sectionTitle p,.sub{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.feature{padding:22px}.feature b{font-size:17px}.feature p{color:var(--muted);line-height:1.55}.pageTitle{font-size:38px;margin:5px 0 8px}.focusLayout{display:grid;grid-template-columns:1fr 360px;gap:18px}.focusMain{padding:32px;text-align:center}.timer{font-size:clamp(70px,12vw,125px);font-weight:900;letter-spacing:-5px;margin:18px 0;color:var(--text)}.timer.running{color:var(--accent);text-shadow:0 0 40px #63e6be33}.timer.break{color:var(--warn);text-shadow:0 0 40px #ffd16633}.status{color:var(--muted);min-height:24px}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.controls button{padding:12px 17px;border-radius:12px}.field{padding:18px;background:#ffffff06;border:1px solid var(--line);border-radius:17px;margin-bottom:13px;text-align:left}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}.field input,.field select{width:100%;padding:11px 12px;background:#081526;color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none}.fieldRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:flex;gap:8px}.choice button{flex:1;padding:11px;background:#ffffff07;color:var(--muted);border:1px solid var(--line);border-radius:10px}.choice button.sel{border-color:var(--accent);color:var(--accent);background:#63e6be0d}.reason{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.reason button{padding:10px;background:#ffffff07;color:var(--muted);border:1px solid var(--line);border-radius:10px}.reason button.sel{border-color:var(--accent);color:var(--accent);background:#63e6be0d}.warning{display:none;margin-top:18px;padding:13px;border-radius:12px;background:#ff6b7a12;border:1px solid #ff6b7a55;color:#ff9aa5}.warning.show{display:block}.breakBox{display:none;margin-top:18px;padding:18px;border-radius:17px;background:#ffd1660d;border:1px solid #ffd16655}.breakBox.show{display:block}.breakBox strong{color:var(--warn)}.chart{height:180px;display:flex;align-items:end;gap:8px;padding:15px 5px 5px}.bar{flex:1;min-width:7px;border-radius:7px 7px 2px 2px;background:linear-gradient(to top,var(--accent2),var(--accent));position:relative}.bar span{position:absolute;bottom:-22px;font-size:10px;color:var(--muted);left:50%;transform:translateX(-50%)}.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.cell{aspect-ratio:1;border-radius:6px;background:#1b3048;position:relative}.cell:hover{outline:2px solid #fff8}.heat-legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:15px}.legendBox{width:14px;height:14px;border-radius:4px}.l0{background:#1b3048}.l1{background:#ff6b7a}.l2{background:#ff9f43}.l3{background:#ffd166}.l4{background:#63e6be}.analysis{padding:20px;border-left:3px solid var(--accent);background:#63e6be08;border-radius:12px;line-height:1.7}.methodGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.methodCard{padding:22px}.methodCard input{font-size:20px;font-weight:800;background:transparent;color:var(--text);border:0;border-bottom:1px dashed var(--line);width:100%;padding:5px 0;outline:none}.methodMeta{color:var(--muted);font-size:13px;margin-top:8px}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.compare div{padding:12px;border-radius:12px;background:#ffffff06;text-align:center}.compare strong{font-size:22px;display:block}.goalList{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.goalCard{padding:20px}.goalCard input{width:100%;background:transparent;color:var(--text);border:0;border-bottom:1px dashed var(--line);font-weight:800;font-size:18px;padding:5px 0;outline:none}.goalStats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{padding:7px 10px;border-radius:999px;background:#ffffff08;color:var(--muted);font-size:12px}.garden{min-height:420px;display:grid;place-items:center;position:relative;overflow:hidden}.ground{position:absolute;bottom:0;width:100%;height:90px;background:#09182a;border-top:1px solid var(--line)}.tree{font-size:150px;filter:drop-shadow(0 18px 25px #0008);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}.badges{display:flex;gap:10px;flex-wrap:wrap}.badge{padding:11px 13px;border-radius:12px;background:#ffffff07;border:1px solid var(--line)}.badge.lock{opacity:.35}.runningBanner{position:fixed;left:50%;top:82px;transform:translateX(-50%);z-index:19;background:#ff6b7a;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px #0008;white-space:nowrap}.hidden{display:none!important}@keyframes pulse{50%{transform:scale(1.03);opacity:.8}}.breakPulse{animation:pulse 1.2s infinite}.modalBack{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px}.modal{width:min(520px,100%);padding:28px}.modal h2{margin-top:0}@media(max-width:900px){.hero,.focusLayout{grid-template-columns:1fr}.methodGrid,.goalList{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topbar{padding:15px 4%;flex-direction:column;align-items:flex-start}.grid,.cards,.methodGrid,.goalList{grid-template-columns:1fr}.fieldRow{grid-template-columns:1fr}.heat{grid-template-columns:repeat(7,1fr)}.runningBanner{font-size:12px;max-width:92%;overflow:hidden}.heroText{padding:28px}}
.xpbar{height:8px;background:#ffffff12;border-radius:99px;margin-top:12px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.goalTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.goalTop input{min-width:0}.progress{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:14px 0 8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.l0{background:#172b42}.lbad{background:#ff6b7a}.l1{background:#ff9f43}.l2{background:#ffd166}.l3{background:#a8e063}.l4{background:#63e6be}.cell.hi{box-shadow:inset 0 -8px #ffffff25}.cell.mid{opacity:.8}.friendRow{padding:12px;border-bottom:1px solid var(--line)}.friendRow:last-child{border-bottom:0}textarea{width:100%;min-height:90px;background:#081526;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;resize:vertical}</style></head>
<body><div class="app"><header class="topbar"><div class="brand">◉ <span>Focus</span>Study</div><nav class="nav"><button data-page="home" onclick="showPage('home')">Tổng quan</button><button data-page="focus" onclick="showPage('focus')">Tập trung</button><button data-page="goals" onclick="showPage('goals')">🎯 Mục tiêu</button><button data-page="stats" onclick="showPage('stats')">Phân tích</button><button data-page="experiments" onclick="showPage('experiments')">🧪 Thí nghiệm</button><button data-page="friends" onclick="showPage('friends')">👥 Bạn bè</button><button data-page="garden" onclick="showPage('garden')">🏆 Phần thưởng</button></nav></header><main id="main"></main></div>
<script>
const KEY='FocusStudyV3';
const $=id=>document.getElementById(id), save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=p=>p+Date.now()+Math.random().toString(36).slice(2,6), fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');
const mins=m=>`${Math.floor((m||0)/60)}h ${(m||0)%60}p`, level=()=>Math.floor(state.xp/250)+1;
const defaults={sessions:[],xp:0,streak:0,lastDate:null,totalMinutes:0,room:null,roomXP:0,roomHours:0,methods:[{id:'m1',title:'Pomodoro 45/5',description:'45 phút học, 5 phút nghỉ'}],goals:[],friends:[],challenges:[]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;
if(!state.methods?.length)state.methods=defaults.methods;if(!state.goals)state.goals=[];if(!state.sessions)state.sessions=[];state.friends??=[];state.challenges??=[];state.xp??=0;state.totalMinutes??=0;state.redeemed??=[];state.currentRoom??=null;state.rooms??=[];state.streak??=0;state.room??=null;state.roomXP??=0;state.roomHours??=0;
if(!state.goals.length)state.goals=[{id:uid('g'),title:'Mục tiêu đầu tiên',targetValue:180,targetUnit:'day',priority:'high',startDate:new Date().toISOString().slice(0,10),endDate:''}];save();
let timer=null,running=false,phase='focus',focusRemaining=2700,breakRemaining=300,currentMinutes=45,overtimeSeconds=0,overtime=false,breakMode=true,breakEvery=45,breakLength=5,breakCount=0,breakMinutes=0,distractions=0,reason='',awayAt=0,awayTotal=0,selectedGoal='',selectedMethod='m1',sessionStarted=false;
function avg(){return state.sessions.length?Math.round(state.sessions.reduce((a,s)=>a+s.score,0)/state.sessions.length):0}
function showPage(p){if(running&&p!=='focus'){distractions++;if(!awayAt)awayAt=Date.now();alarm()}if(p==='focus'&&running){if(awayAt){awayTotal+=Date.now()-awayAt;awayAt=0}stopAlarm()}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({home,focus,goals,stats,experiments,friends,garden}[p]||home)()}
function stat(i,t,v){return `<div class="stat"><div>${i} ${t}</div><div class="num">${v}</div></div>`}
function home(){let l=level();$('main').innerHTML=`${banner()}<section class="hero"><div class="panel heroText"><div class="eyebrow">FOCUS INTELLIGENCE V3</div><h1>Học sâu.<br><span style="color:var(--accent)">Tập trung thật.</span></h1><p>🎯 Mục tiêu · ⏱️ Tập trung · 📊 Phân tích · 🧪 Thí nghiệm · 👥 Học cùng bạn.</p><div class="actions"><button class="primary" onclick="showPage('focus')">▶ Bắt đầu học</button><button class="ghost" onclick="showPage('goals')">＋ Thêm mục tiêu</button></div></div><div class="panel scorePanel"><div class="scoreLabel">FOCUS SCORE</div><div class="ring" style="background:conic-gradient(var(--accent) ${avg()*3.6}deg,#1a3047 ${avg()*3.6}deg)"><div class="ringInner"><div class="score">${avg()}</div><div class="scoreLabel">/100</div></div></div><div style="margin-top:15px;color:var(--accent)">Level ${l} · ${state.xp} XP</div><div class="xpbar"><i style="width:${(state.xp%250)/250*100}%"></i></div></div></section><div class="grid">${stat('🔥','Chuỗi',state.streak+' ngày')}${stat('⏱','Tổng học',mins(state.totalMinutes))}${stat('📚','Phiên',state.sessions.length)}${stat('🧠','Focus Score',avg()+'/100')}</div><div class="sectionTitle"><div><h2>🎯 Mục tiêu ưu tiên</h2><p>Không giới hạn số mục tiêu. Mỗi phiên học chọn đúng một mục tiêu.</p></div><button class="ghost" onclick="showPage('goals')">Xem tất cả →</button></div><div class="goalList">${state.goals.slice().sort((a,b)=>({high:0,normal:1,low:2}[a.priority]||1)-({high:0,normal:1,low:2}[b.priority]||1)).slice(0,5).map(goalCard).join('')}</div><div class="cards"><div class="panel feature"><b>⏱️ Nghỉ có chủ đích</b><p>Chọn 45/5 hoặc tắt nghỉ để học liên tục. Nghỉ theo kế hoạch không phải sao nhãng.</p></div><div class="panel feature"><b>🧪 Thí nghiệm</b><p>Tạo bao nhiêu cách học tùy ý. App chỉ đưa số liệu, anh tự quyết định cách phù hợp.</p></div><div class="panel feature"><b>🏆 XP không gây áp lực</b><p>Học thật nhận XP. Không trừ XP vì sao nhãng hay vì nghỉ đúng kế hoạch.</p></div></div>`}
function goalProgress(g){let ss=state.sessions.filter(s=>s.goalId===g.id),now=new Date(),start,end,label;if(g.targetUnit==='total'){start=g.startDate?new Date(g.startDate):new Date(0);end=g.endDate?new Date(g.endDate+'T23:59:59'):new Date(8640000000000000);return {done:ss.filter(s=>new Date(s.date)>=start&&new Date(s.date)<=end).reduce((a,s)=>a+s.duration,0),target:g.targetValue,label:'Tổng'}}if(g.targetUnit==='week'){let d=(now.getDay()+6)%7;start=new Date(now);start.setHours(0,0,0,0);start.setDate(now.getDate()-d);end=new Date(start);end.setDate(start.getDate()+7);label='Tuần'}else if(g.targetUnit==='month'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,1);label='Tháng'}else{start=new Date(now);start.setHours(0,0,0,0);end=new Date(start);end.setDate(start.getDate()+1);label='Hôm nay'}return {done:ss.filter(s=>new Date(s.date)>=start&&new Date(s.date)<end).reduce((a,s)=>a+s.duration,0),target:g.targetValue||0,label}}
function goalCard(g){let p=goalProgress(g),pc=p.target?Math.min(100,p.done/p.target*100):0;return `<div class="panel goalCard"><div class="goalTop"><b>${g.priority==='high'?'⭐':g.priority==='low'?'▫️':'•'} ${esc(g.title)}</b><span class="pill">${g.priority==='high'?'Ưu tiên cao':g.priority==='low'?'Thấp':'Bình thường'}</span></div><div class="goalStats"><span class="pill">${p.target?mins(p.target):'Chưa đặt chỉ tiêu'}/${p.label}</span><span class="pill">${p.target?Math.round(p.done/p.target*100):0}%</span></div><div class="progress"><i style="width:${pc}%"></i></div><small>${mins(p.done)} / ${mins(p.target)}${p.target&&p.done>p.target?' · 🎉 Vượt mục tiêu':''}</small></div>`}
function goals(){ $('main').innerHTML=`${banner()}<h1 class="pageTitle">🎯 Mục tiêu lớn</h1><div class="sub">Tự tạo bao nhiêu mục tiêu cũng được: ngày, tuần, tháng hoặc tổng số giờ trong một khoảng thời gian.</div><div class="actions"><button class="primary" onclick="addGoal()">＋ THÊM MỤC TIÊU</button></div><div class="goalList" style="margin-top:20px">${state.goals.map(g=>{let p=goalProgress(g),pc=p.target?Math.min(100,p.done/p.target*100):0;return `<div class="panel goalCard"><div class="goalTop"><input value="${esc(g.title)}" onchange="renameGoal('${g.id}',this.value)"><span class="pill">${g.priority}</span></div><div class="goalStats"><span class="pill">${g.targetValue?mins(g.targetValue):'Chưa đặt'} / ${g.targetUnit}</span><span class="pill">${g.endDate?'Đến '+g.endDate:'Không giới hạn'}</span></div><div class="progress"><i style="width:${pc}%"></i></div><small>${mins(p.done)} / ${mins(p.target)} · ${p.target?Math.round(p.done/p.target*100):0}%</small><div class="actions"><button class="ghost" onclick="editGoal('${g.id}')">✏️ Sửa</button><button class="danger" onclick="delGoal('${g.id}')">Xóa</button></div></div>`}).join('')}</div>`}
function addGoal(){let title=prompt('Tên mục tiêu:','Học kế toán');if(!title)return;let t=prompt('Số phút mục tiêu (210 = 3 giờ 30 phút):','180');let unit=prompt('day / week / month / total:','day')||'day';let pri=prompt('high / normal / low:','high')||'normal';let end=prompt('Ngày kết thúc YYYY-MM-DD (trống = không giới hạn):','')||'';state.goals.push({id:uid('g'),title:title.trim(),targetValue:Math.max(0,Number(t)||0),targetUnit:['day','week','month','total'].includes(unit)?unit:'day',priority:['high','normal','low'].includes(pri)?pri:'normal',startDate:new Date().toISOString().slice(0,10),endDate:end});save();goals()}
function renameGoal(id,v){let g=state.goals.find(x=>x.id===id);if(g&&v.trim()){g.title=v.trim();save()}}
function editGoal(id){let g=state.goals.find(x=>x.id===id);if(!g)return;let t=prompt('Số phút mục tiêu:',g.targetValue),u=prompt('day / week / month / total:',g.targetUnit),p=prompt('high / normal / low:',g.priority),e=prompt('Ngày kết thúc:',g.endDate||'');Object.assign(g,{targetValue:Math.max(0,Number(t)||0),targetUnit:['day','week','month','total'].includes(u)?u:g.targetUnit,priority:['high','normal','low'].includes(p)?p:g.priority,endDate:e||''});save();goals()}
function delGoal(id){if(state.goals.length<2)return alert('Hãy giữ ít nhất một mục tiêu.');if(confirm('Xóa mục tiêu?')){state.goals=state.goals.filter(g=>g.id!==id);save();goals()}}
function focus(){if(!sessionStarted){focusRemaining=currentMinutes*60;breakRemaining=breakLength*60}if(!selectedGoal&&state.goals[0])selectedGoal=state.goals[0].id;$('main').innerHTML=`${banner()}<h1 class="pageTitle">⏱️ Chế độ tập trung</h1><div class="sub">Không có “tạm dừng”. Anh chọn <b>nghỉ có chủ đích</b> hoặc <b>học liên tục</b>.</div><div class="focusLayout"><section class="panel focusMain"><div class="eyebrow">${phase==='break'?'REWARD BREAK':'FOCUS MODE'}</div><div id="timer" class="timer ${phase==='break'?'break':''}">${fmt(phase==='break'?breakRemaining:focusRemaining)}</div><div id="status" class="status">${running?(phase==='break'?'🎁 Nghỉ có chủ đích — không bị trừ điểm.':'● Đang tập trung — đừng rời tab'):'Sẵn sàng bắt đầu'}</div><div class="controls"><button class="primary" onclick="startTimer()">▶ ${sessionStarted?'TIẾP TỤC':'BẮT ĐẦU'}</button><button class="ghost" onclick="resetTimer()">↺ ĐẶT LẠI</button>${overtime?'<button class="danger" onclick="finish()">✓ KẾT THÚC & NHẬN XP</button>':''}</div><div id="warning" class="warning">🚨 Bạn đã rời màn hình học. Hành vi này đã được ghi nhận.</div></section><aside><div class="field"><label>THỜI LƯỢNG</label><select onchange="setDuration(this.value)">${[15,25,30,45,60,90,120,180,240,300,480,540].map(x=>`<option value="${x}" ${x===currentMinutes?'selected':''}>${x>=60?mins(x):x+' phút'}</option>`).join('')}</select></div><div class="field"><label>NGHỈ CÓ CHỦ ĐÍCH?</label><div class="choice"><button class="${breakMode?'sel':''}" onclick="setBreak(true)">Có</button><button class="${!breakMode?'sel':''}" onclick="setBreak(false)">Không</button></div><div class="fieldRow"><div><label>Mỗi</label><select onchange="breakEvery=+this.value"><option>45</option><option>50</option><option>60</option><option>90</option></select></div><div><label>Nghỉ</label><select onchange="breakLength=+this.value"><option>5</option><option>10</option><option>15</option></select></div></div></div><div class="field"><label>🧪 CÁCH HỌC / THÍ NGHIỆM</label><select id="method">${state.methods.map(m=>`<option value="${m.id}" ${selectedMethod===m.id?'selected':''}>${esc(m.title)}</option>`).join('')}</select><button class="ghost" style="width:100%;margin-top:8px" onclick="addMethod()">＋ Thêm cách học</button></div><div class="field"><label>🎯 MỤC TIÊU</label><select id="goal">${state.goals.map(g=>`<option value="${g.id}" ${selectedGoal===g.id?'selected':''}>${g.priority==='high'?'⭐':''} ${esc(g.title)}</option>`).join('')}</select><button class="ghost" style="width:100%;margin-top:8px" onclick="addGoalFromFocus()">＋ Thêm mục tiêu</button></div><div class="field"><label>SAO NHÃNG</label><div class="reason"><button onclick="reason='Điện thoại'">📱</button><button onclick="reason='Tin nhắn'">💬</button><button onclick="reason='Mạng xã hội'">🌐</button><button onclick="reason='Tiếng ồn'">🔊</button><button onclick="reason='Mệt mỏi'">😴</button></div><small>${distractions} lần sao nhãng · ${breakCount} lần nghỉ</small></div></aside></div>`}
function setDuration(v){if(!running&&!sessionStarted){currentMinutes=+v;focusRemaining=currentMinutes*60}}
function setBreak(v){if(!running&&!sessionStarted){breakMode=v;focus()}}
function addGoalFromFocus(){addGoal()}
function addMethod(){let t=prompt('Tên cách học / thí nghiệm:','Học liên tục 60 phút');if(!t)return;let d=prompt('Mô tả:','');state.methods.push({id:uid('m'),title:t,description:d||''});save();focus()}
function startTimer(){if(running)return;sessionStarted=true;selectedGoal=$('goal')?.value||selectedGoal;selectedMethod=$('method')?.value||selectedMethod;running=true;timer=setInterval(tick,1000);alarmStopIfNeeded();renderTimer()}
function tick(){
 if(phase==='focus'){
   if(focusRemaining>0){
     focusRemaining--;
     if(focusRemaining<=0){
       if(breakMode&&breakMinutes+breakLength<currentMinutes){
         phase='break';breakCount++;breakRemaining=breakLength*60;breakMinutes+=breakLength;
       }else{
         overtime=true;overtimeSeconds=0;
       }
     }
   }else{
     overtime=true;overtimeSeconds++;
   }
 }else{
   breakRemaining--;
   if(breakRemaining<=0){phase='focus';alarmStopIfNeeded()}
 }
 renderTimer()
}
function renderTimer(){
 let e=$('timer');
 if(e){
   if(phase==='break') e.textContent=fmt(breakRemaining);
   else if(overtime) e.textContent='+'+fmt(overtimeSeconds);
   else e.textContent=fmt(focusRemaining);
 }
 let s=$('status');
 if(s){
   if(phase==='break') s.textContent='🎁 Nghỉ có chủ đích — đây là phần thưởng.';
   else if(overtime) s.textContent='🔥 Đã vượt mục tiêu! Bạn đang tích thêm XP.';
   else s.textContent='● Đang tập trung — đừng rời tab';
 }
}
function resetTimer(){clearInterval(timer);timer=null;running=false;sessionStarted=false;phase='focus';overtime=false;overtimeSeconds=0;focusRemaining=currentMinutes*60;breakRemaining=breakLength*60;breakCount=0;breakMinutes=0;distractions=0;awayTotal=0;stopAlarm();focus()}
function finish(){
 clearInterval(timer);timer=null;running=false;stopAlarm();
 if(awayAt){awayTotal+=Date.now()-awayAt;awayAt=0}
 let goalId=$('goal')?.value||selectedGoal,methodId=$('method')?.value||selectedMethod;
 let overtimeMinutes=Math.floor(overtimeSeconds/60);
 let actualMinutes=currentMinutes+overtimeMinutes;
 let score=Math.max(0,Math.min(100,Math.round(75-distractions*7-(awayTotal/60000)*2+Math.min(15,actualMinutes/10))));
 let baseXP=Math.round(score/2)+currentMinutes+breakCount*3;
 let overtimeXP=overtimeMinutes*5;
 let xp=baseXP+overtimeXP;
 let g=state.goals.find(x=>x.id===goalId),before=g?goalProgress(g).done:0;
 state.sessions.push({date:new Date().toISOString(),duration:actualMinutes,plannedDuration:currentMinutes,overtimeMinutes,distractions,score,goalId,methodId,goalTitle:g?.title||'',methodTitle:state.methods.find(x=>x.id===methodId)?.title||'',breakCount,breakMinutes,breakMode,reason});
 state.totalMinutes+=actualMinutes;state.xp+=xp;
 if(state.room){
   state.roomHours=(state.roomHours||0)+actualMinutes;
   state.roomXP=(state.roomXP||0)+xp;
   state.room.myMinutes=(state.room.myMinutes||0)+actualMinutes;
   state.room.myXP=(state.room.myXP||0)+xp;
 }
 let today=new Date().toISOString().slice(0,10),yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
 if(state.lastDate!==today)state.streak=state.lastDate===yesterday?state.streak+1:1;
 state.lastDate=today;
 let completed=g&&g.targetValue&&before<g.targetValue&&goalProgress(g).done>=g.targetValue;
 if(completed)state.xp+=100;
 save();sessionStarted=false;phase='focus';overtime=false;overtimeSeconds=0;
 let rewardXP=xp+(completed?100:0);
 $('main').innerHTML=`<div class="panel" style="max-width:760px;margin:40px auto;padding:45px;text-align:center">
 <div style="font-size:60px">${overtimeMinutes>0?'🔥':completed?'🎉':'🏆'}</div><div class="eyebrow">SESSION COMPLETE</div>
 <h1 style="font-size:48px">${score} / 100</h1>
 <p>Học thực tế <b>${actualMinutes} phút</b> · đặt ${currentMinutes} phút · ${distractions} sao nhãng · ${breakCount} lần nghỉ.</p>
 ${overtimeMinutes>0?`<p style="color:var(--accent);font-weight:800">🔥 Vượt mục tiêu ${overtimeMinutes} phút → +${overtimeXP} XP thưởng</p>`:''}
 ${completed?`<p style="color:var(--warn);font-weight:800">🎯 Hoàn thành mục tiêu → +100 XP</p>`:''}
 <div class="grid">${stat('⚡','XP','+'+rewardXP)}${stat('🔥','Chuỗi',state.streak+' ngày')}${stat('🧠','Focus',score)}${stat('⏱','Học thật',actualMinutes+' phút')}</div>
 <div class="field" style="text-align:left"><label>📝 NHẬT KÝ</label><textarea id="note" placeholder="Hôm nay tôi đã học..."></textarea></div>
 <div class="actions" style="justify-content:center"><button class="primary" onclick="saveNote();showPage('stats')">Lưu & xem phân tích</button><button class="ghost" onclick="showPage('focus')">Phiên mới</button></div></div>`
}
function saveNote(){let s=state.sessions[state.sessions.length-1];if(s){s.note=$('note')?.value||'';save()}}
function experiments(){let ss=state.sessions;$('main').innerHTML=`${banner()}<h1 class="pageTitle">🧪 Các cách học / Thí nghiệm</h1><div class="sub">Không giới hạn. Tạo phương pháp mới và so sánh dữ liệu.</div><button class="primary" onclick="addMethod()">＋ THÊM CÁCH HỌC</button><div class="methodGrid" style="margin-top:20px">${state.methods.map(m=>{let a=ss.filter(s=>s.methodId===m.id),sc=a.length?Math.round(a.reduce((x,s)=>x+s.score,0)/a.length):0,di=a.length?(a.reduce((x,s)=>x+s.distractions,0)/a.length).toFixed(1):'—';return `<div class="panel methodCard"><b>${esc(m.title)}</b><p>${esc(m.description||'')}</p><div class="compare"><div><strong>${a.length?sc:'—'}</strong>Focus</div><div><strong>${di}</strong>Sao nhãng/phiên</div><div><strong>${a.length}</strong>Phiên</div></div></div>`}).join('')}</div>`}
function stats(){let ss=state.sessions,reasonCount={};ss.forEach(s=>{if(s.reason)reasonCount[s.reason]=(reasonCount[s.reason]||0)+1});let cells=[];for(let i=29;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10),a=ss.filter(s=>s.date.slice(0,10)===k),sc=a.length?Math.round(a.reduce((x,s)=>x+s.score,0)/a.length):0,total=a.reduce((x,s)=>x+s.duration,0);let c=!a.length?'l0':sc>=85?'l4':sc>=70?'l3':sc>=55?'l2':sc>=35?'l1':'lbad';let z=total>=180?' hi':total>=90?' mid':'';cells.push(`<div class="cell ${c}${z}" title="${k}: Focus ${sc}, ${mins(total)}"></div>`)}let common=Object.entries(reasonCount).sort((a,b)=>b[1]-a[1])[0];$('main').innerHTML=`${banner()}<h1 class="pageTitle">📊 Phân tích</h1><div class="sub">Kỷ luật = thời gian học. Tập trung = Focus Score. Hai thứ không phải một.</div><div class="grid">${stat('🧠','Focus Score',avg()+'/100')}${stat('⏱','Tổng học',mins(state.totalMinutes))}${stat('🚨','Sao nhãng',ss.reduce((a,s)=>a+s.distractions,0))}${stat('🔥','Chuỗi',state.streak+' ngày')}</div><div class="panel" style="padding:25px;margin-top:18px"><h2>🗺️ Bản đồ tập trung 30 ngày</h2><p>Màu ô biểu thị mức Focus Score. Ô càng đậm/đầy biểu thị thời gian học nhiều hơn.</p><div class="heat">${cells.join('')}</div><div class="heat-legend"><span>Chưa học</span><i class="legendBox lbad"></i><i class="legendBox l1"></i><i class="legendBox l2"></i><i class="legendBox l3"></i><i class="legendBox l4"></i><span>Tập trung cao</span></div></div><div class="panel analysis" style="margin-top:18px"><b>💡 Phân tích dữ liệu</b><br>${common?`Lý do sao nhãng xuất hiện nhiều nhất: <b>${esc(common[0])}</b>.`:ss.length?'Đã có dữ liệu, hãy tiếp tục thử các cách học khác nhau.':'Chưa đủ dữ liệu.'} App không kết luận phương pháp nào tốt nhất; anh tự quyết định dựa trên dữ liệu.</div>`}
function friends(){
let active=state.currentRoom;
$('main').innerHTML=`${banner()}<h1 class="pageTitle">👥 Học cùng bạn bè</h1>
<div class="sub">Mỗi phòng là một nhóm riêng. Bạn tự tạo phòng mới bất cứ lúc nào và tự mời bạn bè bằng mã hoặc link.</div>
<div class="cards">
<div class="panel feature"><b>🏫 Tạo phòng mới</b><p>Tạo một phòng học riêng, đặt tên rồi gửi link cho bạn bè.</p><button class="primary" onclick="createRoom()">＋ Tạo phòng mới</button></div>
<div class="panel feature"><b>🔗 Tham gia phòng</b><p>Dán mã hoặc link phòng mà bạn bè gửi.</p><button class="ghost" onclick="joinRoom()">Tham gia</button></div>
<div class="panel feature"><b>🏆 Thử thách</b><p>Tạo thử thách cho nhóm như “Ai đạt 20 giờ trước?”.</p><button class="ghost" onclick="challenge()">Tạo thử thách</button></div>
</div>
<div class="sectionTitle"><div><h2>🏫 Các phòng của bạn</h2><p>Phòng cũ được lưu lại để lần sau bạn quay lại.</p></div></div>
<div class="goalList">${state.rooms.length?state.rooms.map(r=>`<div class="panel goalCard"><div class="goalTop"><b>🏫 ${esc(r.name)}</b><span class="pill">${esc(r.code)}</span></div><div class="goalStats"><span class="pill">👥 ${r.members?.length||0} thành viên</span><span class="pill">${r.createdAt?new Date(r.createdAt).toLocaleDateString('vi-VN'):''}</span></div><div class="actions"><button class="primary" onclick="openRoom('${r.code}')">Vào phòng</button><button class="ghost" onclick="copyRoomLink('${r.code}')">🔗 Copy link</button><button class="danger" onclick="deleteRoom('${r.code}')">Xóa</button></div></div>`).join(''):'<div class="panel feature"><b>Chưa có phòng</b><p>Hãy bấm “Tạo phòng mới” để tạo phòng đầu tiên.</p></div>'}</div>
${active?`<div class="panel" style="padding:25px;margin-top:18px"><div class="goalTop"><div><h2 style="margin:0">🏫 ${esc(active.name)}</h2><p class="sub">Mã phòng: <b>${esc(active.code)}</b></p></div><button class="ghost" onclick="createRoom()">＋ Tạo phòng mới</button></div><div class="actions"><button class="primary" onclick="copyRoomLink('${active.code}')">🔗 Copy link mời</button></div><h3>👥 Thành viên do bạn bè tham gia</h3>${active.members?.length?active.members.map(f=>`<div class="friendRow">👤 ${esc(f.name||f)} <span class="pill">${esc(f.status||'đã tham gia')}</span></div>`).join(''):'<p class="sub">Chưa có bạn nào vào. Hãy copy link mời gửi cho bạn bè.</p>'}</div>`:''}`;
}
function createRoom(){
let name=prompt('Tên phòng học:','Học 2 giờ cùng nhau');if(!name)return;
let c=Math.random().toString(36).slice(2,8).toUpperCase();
let room={code:c,name:name.trim(),createdAt:new Date().toISOString(),members:[]};
state.rooms.push(room);state.currentRoom=room;save();
copyRoomLink(c,true);friends();
}
function roomLink(code){
  const base=location.href.split('?')[0].split('#')[0];
  return base+'?room='+encodeURIComponent(code);
}
function copyRoomLink(code,notify=false){
let link=roomLink(code);
if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>{if(notify)alert('Đã tạo phòng! Link mời đã được copy:\n'+link)}).catch(()=>{if(notify)prompt('Copy link phòng này:',link)});
else if(notify)prompt('Copy link phòng này:',link);
}
function openRoom(code){let r=state.rooms.find(x=>x.code===code);if(r){state.currentRoom=r;save();friends()}}
function deleteRoom(code){if(!confirm('Xóa phòng này khỏi danh sách?'))return;state.rooms=state.rooms.filter(x=>x.code!==code);if(state.currentRoom?.code===code)state.currentRoom=null;save();friends()}
function joinRoom(){
let c=prompt('Dán mã phòng hoặc link phòng:','');if(!c)return;
let m=c.match(/[?&]room=([A-Z0-9]+)/i);c=(m?m[1]:c.trim()).toUpperCase();
let r=state.rooms.find(x=>x.code===c);
if(!r){r={code:c,name:'Phòng '+c,createdAt:new Date().toISOString(),members:[]};state.rooms.push(r)}
let name=prompt('Tên hiển thị của bạn:','Bạn');if(!name)return;
if(!r.members.some(x=>(x.name||x).toLowerCase()===name.trim().toLowerCase()))r.members.push({name:name.trim(),status:'đã tham gia',minutes:0,xp:0});
state.currentRoom=r;save();friends();
}
function challenge(){
 let t=prompt('Tên thử thách:','Cả nhóm học 20 giờ');
 if(t){state.challenges.push({title:t,createdAt:new Date().toISOString()});save();friends()}
}
const rewards=[
{id:'tree',cost:300,title:'🌱 Cây mới',desc:'Mở cây mới trong khu vườn'},
{id:'theme',cost:800,title:'🎨 Chủ đề mới',desc:'Mở một chủ đề giao diện'},
{id:'map',cost:1500,title:'🗺️ Bản đồ nâng cao',desc:'Mở bản đồ nâng cao'},
{id:'custom',cost:3000,title:'👑 Tùy chỉnh nâng cao',desc:'Mở tùy chỉnh nâng cao'}
];
function redeemReward(id){let r=rewards.find(x=>x.id===id);if(!r)return;if(state.xp<r.cost)return alert('Bạn chưa đủ XP để đổi phần thưởng này.');if(!confirm(`Đổi ${r.cost} XP lấy ${r.title}?`))return;state.xp-=r.cost;state.redeemed??=[];state.redeemed.push({id:r.id,title:r.title,cost:r.cost,date:new Date().toISOString()});save();garden()}
function garden(){$('main').innerHTML=`${banner()}<h1 class="pageTitle">🏆 Phần thưởng & Đổi quà</h1><div class="sub">Dùng XP kiếm được từ việc học để đổi phần thưởng. XP vượt thời gian đặt ra vẫn được cộng.</div><div class="grid">${stat('⚡','XP',state.xp)}${stat('👑','Cấp','Level '+level())}${stat('⏱','Tổng học',mins(state.totalMinutes))}${stat('🔥','Chuỗi',state.streak+' ngày')}</div><div class="panel garden"><div class="tree">${state.totalMinutes<60?'🌱':state.totalMinutes<180?'🌿':state.totalMinutes<500?'🌳':'🌳🌸🏡'}</div></div><div class="sectionTitle"><div><h2>🎁 Đổi XP lấy quà</h2><p>Chọn phần thưởng bạn muốn mở.</p></div></div><div class="cards">${rewards.map(r=>`<div class="panel feature"><b>${r.title}</b><p>${r.desc}</p><div style="font-weight:800;margin:12px 0">⚡ ${r.cost} XP</div><button class="${state.xp>=r.cost?'primary':'ghost'}" ${state.xp>=r.cost?'':'disabled'} onclick="redeemReward('${r.id}')">${state.xp>=r.cost?'🎁 Đổi ngay':'🔒 Chưa đủ XP'}</button></div>`).join('')}</div>`}
function banner(){return running?`<div class="runningBanner">🚨 ${phase==='break'?'NGHỈ CÓ CHỦ ĐÍCH':'PHIÊN ĐANG CHẠY'} · ${fmt(phase==='break'?breakRemaining:focusRemaining)} · ${distractions} sao nhãng</div>`:''}
let ac=null,at=null;function alarm(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(at)return;let beep=()=>{let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=850;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.35)};beep();at=setInterval(beep,500)}catch(e){}}function stopAlarm(){if(at){clearInterval(at);at=null}}function alarmStopIfNeeded(){stopAlarm()}
document.addEventListener('visibilitychange',()=>{if(!running)return;if(document.hidden){distractions++;awayAt=Date.now();alarm();if($('warning'))$('warning').classList.add('show')}else{if(awayAt){awayTotal+=Date.now()-awayAt;awayAt=0}stopAlarm();if($('warning'))$('warning').classList.remove('show')}});
(function migrate(){let old=localStorage.getItem('focusStudyV2');if(old&&!localStorage.getItem(KEY)){try{let o=JSON.parse(old);state={...defaults,...o};state.methods=o.methods?.length?o.methods:defaults.methods;state.goals=(o.goals||[]).map(g=>({...g,targetValue:g.targetValue||0,targetUnit:g.targetUnit||'day',priority:g.priority||'normal'}));if(!state.goals.length)state.goals=defaults.goals;save()}catch(e){}}})();
(function openRoomFromLink(){let m=location.search.match(/[?&]room=([A-Z0-9]+)/i);if(m){let c=m[1].toUpperCase(),r=state.rooms.find(x=>x.code===c);if(!r){r={code:c,name:'Phòng '+c,createdAt:new Date().toISOString(),members:[]};state.rooms.push(r)}state.currentRoom=r;save();}})();
showPage(location.search.includes('room=')?'friends':'home');
</script></body></html>
